<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهيب وأصدقاؤه – منصة العقارات والمبيتات في تونس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f4;--card:#fff;--ink:#241618;--mut:#6f5f62;--line:#e7dddf;--red:#c8102e;--ok:#12805c;--warn:#b7791f;--soft:#fdeaed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171012;--card:#241a1d;--ink:#f4eaec;--mut:#b3a0a4;--line:#3a2b2f;--red:#ff4d63;--ok:#35c28f;--warn:#e3a94b;--soft:#3a1c24}}
:root[data-theme="dark"]{--bg:#171012;--card:#241a1d;--ink:#f4eaec;--mut:#b3a0a4;--line:#3a2b2f;--red:#ff4d63;--ok:#35c28f;--warn:#e3a94b;--soft:#3a1c24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;line-height:1.6}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;color:var(--red)}
.nb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;display:inline-block}
button.pri{background:var(--red);color:#fff;border-color:var(--red)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.hero{padding:34px 20px;text-align:center;background:var(--red);color:#fff}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:800}.hero p{margin:0 0 12px;opacity:.9;font-size:14px}
.hero button{background:#fff;color:var(--red);border-color:#fff}
.wrap{max-width:1150px;margin:0 auto;padding:22px 16px 60px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cover{height:160px;position:relative;background:var(--soft);cursor:pointer;overflow:hidden}
.cover svg,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:#fff;padding:2px 10px;border-radius:6px}
.b-available{background:var(--ok)}.b-review{background:var(--warn)}.b-rented{background:#64748b}
.fav{position:absolute;top:8px;left:8px;padding:2px 8px;font-size:16px}
.body{padding:14px;flex:1;display:flex;flex-direction:column;gap:4px}
.body h3{margin:0;font-size:16px}.mut{color:var(--mut);font-size:12.5px}.price{color:var(--red);font-weight:800;font-size:18px}
.dist{background:var(--soft);color:var(--red);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:8px;width:fit-content}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px}.acts>*{flex:1;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--red);border-radius:10px;padding:14px}
.stat small{color:var(--mut)}.stat b{display:block;font-size:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.auth{max-width:430px;margin:30px auto}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--red);display:inline-block}
.empty{text-align:center;color:var(--mut);padding:26px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:90px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.cin{max-width:260px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;position:relative}
.modal .x{position:absolute;top:10px;left:10px}
.big{width:100%;height:230px;object-fit:cover;border-radius:10px;background:var(--soft)}
.big svg{width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-top:1px solid var(--line)}td:first-child{color:var(--mut);width:38%}
.intro{text-align:center;max-width:420px;padding:28px 22px}
.intro .ic{font-size:70px;animation:pop .5s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:var(--red)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;display:none;z-index:99}
@media (prefers-reduced-motion:reduce){.intro .ic{animation:none}}
</style>
</head>
<body>
<div class="nav"><div class="brand">🏠 مهيب وأصدقاؤه · تونس</div><div class="nb" id="navb"></div></div>
<div class="hero"><h1>لوّج على دارك، مبيتك أو شريك سكن بكل ثقة</h1><p>عقارات موثّقة، المسافة للكلية بالدقيقة، تواصل مباشر عبر واتساب، ومتابعة الشكاوى</p><button onclick="intro()">▶ فيديو التعريف (30 ثانية)</button></div>
<div class="wrap" id="main"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script>
const ADMIN='21629461304',KEY='mouhib_v3',COMM=0.1;
const CITY={tunis:'تونس الكبرى',ariana:'أريانة',benarous:'بن عروس',manouba:'منوبة',monastir:'المنستير',sousse:'سوسة',sfax:'صفاقس',nabeul:'نابل'};
const TYPE={foyer:'مبيت خاص (Foyer)',studio:'استوديو مفروش',coloc:'كولوك (Colocation)',apt:'شقة'};
const ST={available:'متاح حالياً',review:'قيد المعاينة',rented:'مكرية'};
const COND={any:'بدون تقييد',m:'ذكور فقط',f:'فتيات فقط',fam:'عائلات'};
const COMP={open:'جديدة',work:'قيد المعالجة',done:'تم الحل'};
const REQ={new:'جديد',ok:'مؤكد',paid:'العربون مدفوع',no:'ملغى'};
const RT={deposit:'💳 عربون',visit:'📅 معاينة',ask:'💬 استفسار'};
const ROLE={tenant:'مكتري',landlord:'مالك',broker:'سمسار',admin:'مدير'};
const DOCS=['نسخة من بطاقة التعريف الوطنية (CIN)','شهادة تسجيل بالجامعة (للطلبة)','ضامن + نسخة من بطاقته','عربون شهر واحد','إمضاء عقد الكراء (نسختين)'];
const S=(id,title,city,type,addr,fac,km,min,price,st,cond,rooms,am,start,end,visit)=>({id,owner:'seed',title,city,type,addr,fac,km,min,price,st,cond,rooms,am,start,end,visit,imgs:[]});
const seed=[
S('p1','غرفة لشخصين في مبيت خاص للفتيات','ariana','foyer','حي الغزالة، نهج 7050','ISETCom / INSAT',0.3,3,280,'available','f',2,['واي فاي','غسالة','ماء ساخن'],'2026-10-01','2027-06-30','يومياً 14:00 – 18:00'),
S('p2','استوديو S+1 مفروش للطلبة','tunis','studio','المنار 2، خلف مركب الجامعات','جامعة المنار',0.5,5,450,'review','any',1,['مكيف','واي فاي','مطبخ مجهز'],'2026-11-01','2027-08-31','السبت والأحد 10:00 – 13:00'),
S('p3','شقة S+2 مجهزة للعائلات أو الطالبات','monastir','apt','السقانس، شارع علي بورقيبة','كلية الطب بالمنستير',0.4,4,650,'rented','fam',2,['تدفئة','مصعد'],'2026-09-15','2027-06-15','غير متاحة للمعاينة'),
S('p4','غرفة في كولوك بحي الرياض','sousse','coloc','حي الرياض، سوسة','المعهد العالي للتصرف',1.1,14,220,'available','m',1,['واي فاي','مطبخ مشترك'],'2026-10-10','2027-06-30','يومياً 16:00 – 19:00'),
S('p5','استوديو قرب كلية العلوم','sfax','studio','طريق المطار، صفاقس','كلية العلوم بصفاقس',1.2,15,300,'available','any',1,['مكيف','واي فاي'],'2026-10-15','2027-07-15','بالاتفاق'),
S('p6','مبيت للذكور بمنوبة','manouba','foyer','المنوبة المدينة','ENSI',0.8,10,190,'available','m',3,['واي فاي','ماء ساخن'],'2026-10-01','2027-06-30','يومياً 15:00 – 18:00')];
let db=null;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db)db={users:[],me:null,props:seed,complaints:[],reqs:[],msgs:[],favs:[],seen:0};
let view='home',tab='over',authMode='login',newImgs=[],F={city:'all',type:'all',q:'',st:'all',cond:'all',max:'',min:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('المساحة ممتلئة: نقص من الصور');return false}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
const me=()=>db.users.find(u=>u.id===db.me),prop=id=>db.props.find(p=>p.id===id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function go(v,t){view=v;if(t)tab=t;closeM();render()}
function wa(phone,msg){const p=String(phone).replace(/\D/g,'');window.open(`https://wa.me/${p.length===8?'216'+p:p}?text=${encodeURIComponent(msg)}`,'_blank')}
const mapLink=p=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.addr+' '+CITY[p.city]+' تونس');
function readImg(f,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function art(p){const h=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0),pal=[['#ffd7c2','#c8102e'],['#cfe8ff','#0a4d8c'],['#ffe9a8','#d97706'],['#d4f5e4','#12805c']][h%4];
 let w='';for(let i=0;i<3;i++)for(let j=0;j<2;j++)w+=`<rect x="${85+i*38}" y="${66+j*32}" width="24" height="20" fill="${pal[0]}" stroke="${pal[1]}" stroke-width="1.5"/>`;
 return `<svg viewBox="0 0 300 160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="رسم توضيحي"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="300" height="160" fill="url(#g${h})"/><circle cx="250" cy="34" r="16" fill="#fff" opacity=".85"/><rect y="132" width="300" height="28" fill="${pal[1]}" opacity=".25"/><rect x="70" y="48" width="130" height="88" fill="#fff" stroke="${pal[1]}" stroke-width="3"/><rect x="60" y="40" width="150" height="12" fill="${pal[1]}"/>${w}<rect x="126" y="112" width="18" height="24" fill="${pal[1]}"/></svg>`}
const cover=p=>p.imgs&&p.imgs[0]?`<img src="${p.imgs[0]}" alt="">`:art(p);

function nav(){const u=me(),n=u&&(u.role==='broker'||u.role==='admin')?db.reqs.filter(r=>r.st==='new').length+db.msgs.filter(m=>!m.read).length:0;
 $('navb').innerHTML=`<button onclick="go('home')">🔎 العقارات</button>`+(u?`<button onclick="go('dash')">📊 لوحتي (${ROLE[u.role]})${n?` <span class="pill">${n}</span>`:''}</button><button onclick="logout()">خروج</button>`:`<button class="pri" onclick="go('auth')">🔐 دخول / حساب جديد</button>`)+`<button onclick="theme()" aria-label="الوضع الليلي">🌓</button>`}
function theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function logout(){db.me=null;save();view='home';render();toast('تم تسجيل الخروج')}
function closeM(){$('ov').classList.remove('on');clearInterval(intro.t)}
$('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
function openM(h){$('modal').innerHTML=`<button class="x" onclick="closeM()" aria-label="إغلاق">✕</button>`+h;$('ov').classList.add('on')}

/* ---- intro ---- */
const SL=[['🔎','دوّر على سكنك','فلتر بالولاية، النوع، السعر ومدة المسافة للكلية.'],['📏','قداش تبعد الدار؟','كل عقار يعرض المسافة بالكيلومتر والدقائق من الجامعة.'],['🪪','سجّل وأضف بطاقة التعريف','نسخة من الـ CIN تتوثّق من السمسار وتخوّلك تخلص العربون.'],['💬','احجز بالواتساب','المعاينة والعربون يمشيو مباشرة للسمسار برسالة جاهزة.'],['🛠️','عندك مشكل في الدار؟','بلّغ من حسابك والمالك والسمسار يتابعوها لين تتحل.']];
function intro(){let i=0,play=true;const show=()=>{const [ic,t,d]=SL[i];openM(`<div class="intro"><div class="ic">${ic}</div><h2>${t}</h2><p>${d}</p><div class="bar"><i id="pb"></i></div><div class="tabs" style="justify-content:center"><button id="pp">⏸</button><button id="nx">التالي ⏭</button><button class="pri" onclick="closeM()">ابدأ</button></div><div class="mut">${i+1} / ${SL.length}</div></div>`);
 let w=0;clearInterval(intro.t);intro.t=setInterval(()=>{if(!play)return;w+=2;const b=$('pb');if(b)b.style.width=w+'%';if(w>=100){i=(i+1)%SL.length;if(i===0){closeM();return}show()}},100);
 $('pp').onclick=()=>{play=!play;$('pp').textContent=play?'⏸':'▶'};$('nx').onclick=()=>{i=(i+1)%SL.length;show()}};show();try{localStorage.setItem(KEY+'_i','1')}catch(e){}}

/* ---- auth ---- */
function authView(){return `<div class="panel auth"><h3>🔐 ${authMode==='login'?'تسجيل الدخول':'إنشاء حساب جديد'}</h3>
<div class="tabs"><button class="${authMode==='login'?'on':''}" onclick="authMode='login';render()">دخول</button><button class="${authMode==='signup'?'on':''}" onclick="authMode='signup';render()">حساب جديد</button></div>
<div class="form" style="grid-template-columns:1fr">${authMode==='signup'?`<div><label>الاسم الكامل</label><input id="a_name"></div><div><label>أنا:</label><select id="a_role"><option value="tenant">👤 مكتري / طالب</option><option value="landlord">🏠 مالك عقار</option><option value="broker">⚡ سمسار</option></select></div>`:''}
<div><label>رقم الهاتف (8 أرقام)</label><input id="a_phone" inputmode="numeric" placeholder="22334253"></div><div><label>كلمة المرور</label><input id="a_pw" type="password"></div>
<button class="pri" onclick="submitAuth()">${authMode==='login'?'دخول':'إنشاء الحساب'}</button></div>
<p class="mut">نسخة تجريبية: الحسابات والصور محفوظة في متصفحك فقط. رسائل واتساب تصل فعلاً لرقم السمسار.</p></div>`}
function submitAuth(){const phone=$('a_phone').value.replace(/\D/g,''),pw=$('a_pw').value;
 if(!/^\d{8}$/.test(phone))return toast('رقم الهاتف لازم 8 أرقام');if(pw.length<4)return toast('كلمة المرور قصيرة (4 على الأقل)');
 if(authMode==='signup'){const name=$('a_name').value.trim();if(!name)return toast('أدخل الاسم');if(db.users.some(u=>u.phone===phone))return toast('الرقم مسجّل من قبل، سجّل الدخول');
  const u={id:'u'+Date.now(),name,phone,pw,role:phone===ADMIN.slice(3)?'admin':$('a_role').value,verified:phone===ADMIN.slice(3),cin:''};db.users.push(u);db.me=u.id;toast('مرحباً '+name+' ✓')}
 else{const u=db.users.find(x=>x.phone===phone&&x.pw===pw);if(!u)return toast('الهاتف أو كلمة المرور غير صحيحة');if(u.phone===ADMIN.slice(3)){u.role='admin';u.verified=true}db.me=u.id;toast('أهلاً '+u.name)}
 save();view='dash';tab='over';render()}

/* ---- browse ---- */
function filtered(){return db.props.filter(p=>(F.city==='all'||p.city===F.city)&&(F.type==='all'||p.type===F.type)&&(F.st==='all'||p.st===F.st)&&(F.cond==='all'||p.cond===F.cond)&&(!F.max||p.price<=+F.max)&&(!F.min||p.min<=+F.min)&&(!F.q||(p.title+p.addr+p.fac).toLowerCase().includes(F.q.toLowerCase())))}
function cardHTML(p){const f=db.favs.includes(p.id);
 return `<div class="card"><div class="cover" onclick="showP('${p.id}')"><span class="badge b-${p.st}">${ST[p.st]}</span>${cover(p)}</div>
<div class="body"><div style="display:flex;justify-content:space-between;gap:6px"><h3>${esc(p.title)}</h3><button class="fav" style="position:static" onclick="toggleFav('${p.id}')" aria-label="مفضلة">${f?'❤️':'🤍'}</button></div>
<div class="mut">📍 ${CITY[p.city]} – ${esc(p.addr)}</div>
<div class="dist">🎓 ${esc(p.fac)}: ${p.min} دقيقة · ${p.km} كم</div>
<div><span class="pill">${TYPE[p.type]}</span> <span class="pill">${COND[p.cond]}</span></div>
<div class="price">${p.price} د.ت / شهر</div>
<div class="acts"><button onclick="showP('${p.id}')">تفاصيل</button>${p.st==='rented'?`<button onclick="waProp('${p.id}','ask')">💬 استفسار</button>`:`<button class="pri" onclick="waProp('${p.id}','deposit')">💳 العربون</button><button onclick="waProp('${p.id}','visit')">📅 معاينة</button>`}</div></div></div>`}
const gridHTML=()=>{const l=filtered();return l.length?l.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">ما لقينا حتى عقار بهالفلاتر. جرّب تنقص الشروط.</div>'};
function setF(k,v){F[k]=v;$('grid').innerHTML=gridHTML();$('cnt').textContent=filtered().length}
function toggleFav(id){const i=db.favs.indexOf(id);i<0?db.favs.push(id):db.favs.splice(i,1);save();if(view==='home')$('grid').innerHTML=gridHTML();else render()}
const homeView=()=>`<div class="filters">
<div><label>الولاية</label><select onchange="setF('city',this.value)"><option value="all">كل الولايات</option>${opts(CITY,F.city)}</select></div>
<div><label>النوع</label><select onchange="setF('type',this.value)"><option value="all">كل الأنواع</option>${opts(TYPE,F.type)}</select></div>
<div><label>الحالة</label><select onchange="setF('st',this.value)"><option value="all">الكل</option>${opts(ST,F.st)}</select></div>
<div><label>شروط المالك</label><select onchange="setF('cond',this.value)"><option value="all">الكل</option>${opts(COND,F.cond)}</select></div>
<div><label>أقصى سعر (د.ت)</label><input type="number" value="${F.max}" oninput="setF('max',this.value)"></div>
<div><label>أقصى مسافة للكلية (دقيقة)</label><input type="number" value="${F.min}" oninput="setF('min',this.value)"></div>
<div><label>بحث (عنوان / كلية)</label><input value="${esc(F.q)}" oninput="setF('q',this.value)" placeholder="INSAT، المنار..."></div></div>
<p class="mut"><b id="cnt">${filtered().length}</b> عقار</p><div class="grid" id="grid">${gridHTML()}</div>`;

function showP(id){const p=prop(id),o=db.users.find(u=>u.id===p.owner);
 openM(`<div class="big" id="bigp">${p.imgs[0]?`<img class="big" src="${p.imgs[0]}" alt="">`:art(p)}</div>
${p.imgs.length>1?`<div class="thumbs">${p.imgs.map(s=>`<img src="${s}" alt="" onclick="document.querySelector('#bigp img').src=this.src">`).join('')}</div>`:''}
<h2 style="margin:10px 0 2px">${esc(p.title)}</h2><div class="price">${p.price} د.ت / شهر</div>
<table><tr><td>المكان</td><td>${CITY[p.city]} – ${esc(p.addr)} · <a href="${mapLink(p)}" target="_blank" rel="noopener">🗺️ الخريطة</a></td></tr>
<tr><td>المسافة للكلية</td><td><b>${esc(p.fac)}</b>: ${p.min} دقيقة مشي تقريباً (${p.km} كم)</td></tr>
<tr><td>النوع</td><td>${TYPE[p.type]} · ${p.rooms} غرفة</td></tr><tr><td>الشروط</td><td>${COND[p.cond]}</td></tr>
<tr><td>التجهيزات</td><td>${(p.am||[]).map(esc).join(' · ')||'—'}</td></tr>
<tr><td>مدة الكراء</td><td>من ${p.start} إلى ${p.end}</td></tr><tr><td>المعاينة</td><td>${esc(p.visit)}</td></tr><tr><td>الحالة</td><td>${ST[p.st]}</td></tr></table>
<h3 style="margin:14px 0 6px">📄 الوثائق المطلوبة</h3><ul class="mut" style="margin:0;padding-inline-start:20px">${DOCS.map(d=>`<li>${d}</li>`).join('')}</ul>
<h3 style="margin:14px 0 6px">✉️ ابعث رسالة للسمسار</h3><textarea id="m_t" rows="2" placeholder="مثال: هل الغرفة مازالت متاحة؟"></textarea>
<div class="acts"><button class="pri" onclick="sendMsg('${p.id}')">إرسال (واتساب)</button>${p.st!=='rented'?`<button onclick="waProp('${p.id}','deposit')">💳 العربون</button><button onclick="waProp('${p.id}','visit')">📅 معاينة</button>`:''}</div>`)}
function mkReq(type,id){const u=me();db.reqs.push({id:'r'+Date.now(),type,propId:id,name:u.name,phone:u.phone,st:'new',at:new Date().toLocaleDateString('ar-TN')});save()}
function needLogin(){if(me())return false;toast('سجّل حسابك أولاً باش توصل الرسالة بإسمك');go('auth');authMode='signup';render();return true}
function waProp(id,kind){if(needLogin())return;const p=prop(id),u=me();
 if(kind==='deposit'&&!u.cin&&u.role!=='admin'){toast('أضف نسخة من بطاقة التعريف أولاً (من لوحتي)');return go('dash')}
 mkReq(kind,id);const t={deposit:'أريد دفع العربون وحجز العقار',visit:'أريد حجز موعد معاينة للعقار',ask:'عندي استفسار بخصوص العقار'}[kind];
 wa(ADMIN,`مرحباً سي مهيب، ${t}:\n- ${p.title}\n- ${CITY[p.city]} · ${p.addr}\n- السعر: ${p.price} د.ت/شهر\n- الاسم: ${u.name}\n- الهاتف: ${u.phone}\n- بطاقة التعريف: ${u.cin?'مرفوعة':'غير مرفوعة'}`);toast('تم تسجيل طلبك ✓')}
function sendMsg(id){if(needLogin())return;const t=$('m_t').value.trim();if(!t)return toast('اكتب الرسالة');const u=me(),p=prop(id);
 db.msgs.push({id:'m'+Date.now(),propId:id,name:u.name,phone:u.phone,text:t,at:new Date().toLocaleDateString('ar-TN'),read:false});save();
 wa(ADMIN,`رسالة من ${u.name} (${u.phone}) بخصوص "${p.title}":\n${t}`);closeM();toast('تم إرسال الرسالة ✓')}

/* ---- shared dashboard bits ---- */
const stat=(t,v,c)=>`<div class="stat" ${c?`style="border-inline-start-color:${c}"`:''}><small>${t}</small><b>${v}</b></div>`;
const tabs=(a)=>`<div class="tabs">${a.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>`;
function billPanel(){return `<div class="panel"><h3>💡 حاسبة فواتير STEG / SONEDE</h3><div class="form"><div><label>مبلغ الفاتورة (د.ت)</label><input type="number" id="bill" step="0.001"></div><div><label>أيام إقامة المكتري (من 30)</label><input type="number" id="days"></div><div><label>عدد المتقاسمين</label><input type="number" id="ppl" value="1" min="1"></div></div><button class="pri" style="margin-top:10px" onclick="calcBill()">احسب</button><p id="calc" style="font-weight:700"></p></div>`}
function calcBill(){const b=parseFloat($('bill').value),d=parseFloat($('days').value),n=Math.max(1,parseInt($('ppl').value)||1);if(isNaN(b)||isNaN(d))return toast('أدخل المبلغ وعدد الأيام');const e=(b/30*d)/n;$('calc').innerHTML=`نصيب كل مكتري: ${e.toFixed(3)} د.ت · نصيب المالك: ${(b-e*n).toFixed(3)} د.ت`}
function compRows(l,mg){return l.length?l.map(c=>`<div class="row"><div><b>${esc(c.name)}</b> — ${esc(prop(c.propId)?.title)}<div>${esc(c.text)}</div><span class="pill">${COMP[c.st]}</span></div>${mg?`<div><select onchange="setComp('${c.id}',this.value)">${opts(COMP,c.st)}</select> <button onclick="waC('${c.id}')">واتساب</button></div>`:''}</div>`).join(''):'<div class="empty">ما فما حتى شكوى 👌</div>'}
function setComp(id,v){db.complaints.find(c=>c.id===id).st=v;save();render()}
function waC(id){const c=db.complaints.find(x=>x.id===id);wa(c.phone,`مرحباً ${c.name}، بخصوص شكواك: ${c.text}`)}
function addComplaint(){const u=me(),t=$('c_text').value.trim();if(!t)return toast('اكتب المشكل');const p=prop($('c_prop').value);
 db.complaints.push({id:'c'+Date.now(),propId:p.id,name:u.name,phone:u.phone,text:t,st:'open'});save();wa(ADMIN,`⚠️ شكوى من ${u.name} (${u.phone})\nالعقار: ${p.title}\nالمشكل: ${t}`);toast('وصلت الشكوى ✓');render()}
function reqRows(l,mg){return l.length?l.map(r=>{const p=prop(r.propId);return `<div class="row"><div><span class="pill">${RT[r.type]}</span> <b>${esc(r.name)}</b> (${esc(r.phone)})<div class="mut">${esc(p?.title)} · ${p?.price} د.ت · ${r.at}</div><span class="pill">${REQ[r.st]}</span></div>${mg?`<div><select onchange="setReq('${r.id}',this.value)">${opts(REQ,r.st)}</select> <button onclick="waR('${r.id}')">واتساب</button></div>`:''}</div>`}).join(''):'<div class="empty">لا توجد طلبات بعد</div>'}
function setReq(id,v){db.reqs.find(r=>r.id===id).st=v;save();render()}
function waR(id){const r=db.reqs.find(x=>x.id===id);wa(r.phone,`مرحباً ${r.name}، بخصوص طلبك (${RT[r.type]}) للعقار "${prop(r.propId)?.title}": حالته الآن ${REQ[r.st]}.`)}
function pickImgs(inp){const fs=[...inp.files].slice(0,3);Promise.all(fs.map(f=>readImg(f,700,.6))).then(a=>{newImgs=a;$('prev').innerHTML=a.map(s=>`<img src="${s}" alt="">`).join('')}).catch(()=>toast('تعذّر قراءة الصورة'))}
function addForm(){return `<div class="panel"><h3>➕ أضف عقار جديد</h3><div class="form">
<div><label>العنوان</label><input id="n_title"></div><div><label>الولاية</label><select id="n_city">${opts(CITY)}</select></div><div><label>النوع</label><select id="n_type">${opts(TYPE)}</select></div>
<div><label>العنوان الدقيق</label><input id="n_addr"></div><div><label>الكلية / المؤسسة القريبة</label><input id="n_fac"></div><div><label>المسافة (كم)</label><input id="n_km" type="number" step="0.1"></div>
<div><label>المسافة (دقيقة مشي)</label><input id="n_min" type="number"></div><div><label>السعر الشهري (د.ت)</label><input id="n_price" type="number"></div><div><label>عدد الغرف</label><input id="n_rooms" type="number" value="1"></div>
<div><label>شروط المالك</label><select id="n_cond">${opts(COND)}</select></div><div><label>التجهيزات (افصل بفاصلة)</label><input id="n_am" placeholder="واي فاي، غسالة"></div>
<div><label>بداية الكراء</label><input id="n_start" type="date"></div><div><label>نهاية العقد</label><input id="n_end" type="date"></div><div><label>أوقات المعاينة</label><input id="n_visit"></div>
<div style="grid-column:1/-1"><label>صور العقار (حتى 3)</label><input type="file" accept="image/*" multiple onchange="pickImgs(this)"><div class="thumbs" id="prev"></div></div></div>
<button class="pri" style="margin-top:10px" onclick="addProp()">نشر العقار</button></div>`}
function addProp(){const u=me(),g=id=>$(id).value.trim();if(!g('n_title')||!g('n_addr')||!(+$('n_price').value))return toast('العنوان، المكان والسعر مطلوبين');
 db.props.unshift({id:'p'+Date.now(),owner:u.id,title:g('n_title'),city:$('n_city').value,type:$('n_type').value,addr:g('n_addr'),fac:g('n_fac')||'—',km:+$('n_km').value||0,min:+$('n_min').value||0,price:+$('n_price').value,st:'available',cond:$('n_cond').value,rooms:+$('n_rooms').value||1,am:g('n_am').split(/[,،]/).map(s=>s.trim()).filter(Boolean),start:$('n_start').value||'—',end:$('n_end').value||'—',visit:g('n_visit')||'بالاتفاق',imgs:newImgs});
 if(!save()){db.props.shift();return}newImgs=[];toast('تمت إضافة العقار ✓');render()}
function delProp(id){if(!confirm('تحذف هالعقار؟'))return;db.props=db.props.filter(p=>p.id!==id);save();render()}
function setSt(id,v){prop(id).st=v;save();render()}
const propRows=l=>l.length?l.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><div class="mut">${CITY[p.city]} · ${p.price} د.ت · ${p.imgs.length} صور</div></div><div><select onchange="setSt('${p.id}',this.value)">${opts(ST,p.st)}</select> <button onclick="delProp('${p.id}')" aria-label="حذف">🗑️</button></div></div>`).join(''):'<div class="empty">ما زلت ما زدت حتى عقار.</div>';

/* ---- tenant ---- */
function pickCin(inp){const f=inp.files[0];if(!f)return;readImg(f,900,.6).then(d=>{const u=me();u.cin=d;u.verified=false;u.rejected=false;if(save()){toast('تم رفع البطاقة، في انتظار التوثيق');render()}}).catch(()=>toast('تعذّر قراءة الصورة'))}
function tenantDash(u){const mine=db.complaints.filter(c=>c.phone===u.phone),rq=db.reqs.filter(r=>r.phone===u.phone);
 return `<h2>👤 مرحباً ${esc(u.name)}</h2><div class="stats">${stat('المفضلة',db.favs.length)}${stat('طلباتي',rq.length,'var(--warn)')}${stat('شكاوى مفتوحة',mine.filter(c=>c.st!=='done').length)}${stat('التوثيق',u.verified?'موثّق ✓':u.cin?'قيد المراجعة':'ناقص','var(--ok)')}</div>
<div class="panel"><h3>🪪 بطاقة التعريف (مطلوبة لدفع العربون)</h3><p class="mut">ارفع صورة واضحة للبطاقة. يشوفها السمسار فقط للتوثيق.</p><input type="file" accept="image/*" onchange="pickCin(this)">${u.cin?`<img class="cin" src="${u.cin}" alt="CIN">`:''}</div>
<div class="panel"><h3>📋 طلباتي</h3>${reqRows(rq,false)}</div>
<div class="panel"><h3>⚠️ بلّغ عن مشكل في الدار</h3><div class="form"><div><label>العقار</label><select id="c_prop">${db.props.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><div style="grid-column:1/-1"><label>وصف المشكل (ماء، كهرباء، سخان...)</label><textarea id="c_text" rows="3"></textarea></div></div><button class="pri" style="margin-top:10px" onclick="addComplaint()">إرسال الشكوى</button></div>
<div class="panel"><h3>شكاويّ</h3>${compRows(mine,false)}</div>
<div class="panel"><h3>❤️ المفضلة</h3><div class="grid">${db.props.filter(p=>db.favs.includes(p.id)).map(cardHTML).join('')||'<div class="empty">ما زلت ما زدت حتى عقار</div>'}</div></div>`}

/* ---- landlord ---- */
function landlordDash(u){const mine=db.props.filter(p=>p.owner===u.id),ids=mine.map(p=>p.id),cs=db.complaints.filter(c=>ids.includes(c.propId)),rq=db.reqs.filter(r=>ids.includes(r.propId));
 return `<h2>🏠 لوحة المالك – ${esc(u.name)}</h2><div class="stats">${stat('عقاراتي',mine.length)}${stat('متاحة',mine.filter(p=>p.st==='available').length,'var(--ok)')}${stat('طلبات',rq.length,'var(--warn)')}${stat('شكاوى مفتوحة',cs.filter(c=>c.st!=='done').length)}</div>
${addForm()}<div class="panel"><h3>عقاراتي</h3>${propRows(mine)}</div><div class="panel"><h3>📋 الطلبات على عقاراتي</h3>${reqRows(rq,false)}</div><div class="panel"><h3>⚠️ شكاوى المكترين</h3>${compRows(cs,true)}</div>${billPanel()}`}

/* ---- broker / admin ---- */
function setRole(id,v){db.users.find(x=>x.id===id).role=v;save();render()}
function delUser(id){if(!confirm('تحذف هذا المستخدم؟'))return;db.users=db.users.filter(x=>x.id!==id);save();render()}
function waU(id){const x=db.users.find(y=>y.id===id);wa(x.phone,'مرحباً '+x.name+'، معك إدارة مهيب وأصدقاؤه.')}
function resetDemo(){db.props=[...db.props.filter(p=>p.owner!=='seed'),...JSON.parse(JSON.stringify(seed))];save();render();toast('تمت إعادة العقارات التجريبية')}
function wipe(){if(!confirm('تمسح كل الحسابات والعقارات والطلبات؟'))return;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
function verify(id,ok){const x=db.users.find(u=>u.id===id);x.verified=ok;x.rejected=!ok;save();render()}
function readM(id){db.msgs.find(m=>m.id===id).read=true;save();render()}
function waM(id){const m=db.msgs.find(x=>x.id===id);wa(m.phone,`مرحباً ${m.name}، بخصوص رسالتك:\n"${m.text}"`)}
function brokerDash(u){const paid=db.reqs.filter(r=>r.type==='deposit'&&r.st==='paid'),rev=paid.reduce((a,r)=>a+(prop(r.propId)?.price||0)*COMM,0),pend=db.users.filter(x=>x.role!=='broker'&&x.cin&&!x.verified&&!x.rejected),nr=db.reqs.filter(r=>r.st==='new').length,nm=db.msgs.filter(m=>!m.read).length;
 let b='';
 if(tab==='over')b=`<div class="stats">${stat('عمولتي (10%)',rev.toFixed(0)+' د.ت','var(--ok)')}${stat('عرابين مدفوعة',paid.length)}${stat('طلبات جديدة',nr,'var(--warn)')}${stat('رسائل غير مقروءة',nm)}${stat('توثيق ينتظر',pend.length)}${stat('شكاوى مفتوحة',db.complaints.filter(c=>c.st!=='done').length)}${stat('العقارات',db.props.length)}${stat('المستخدمون',db.users.length)}</div><div class="panel"><h3>آخر الطلبات</h3>${reqRows(db.reqs.slice(-4).reverse(),true)}</div>`;
 if(tab==='req')b=`<div class="panel"><h3>📋 الطلبات (عربون / معاينة / استفسار)</h3>${reqRows(db.reqs.slice().reverse(),true)}</div>`;
 if(tab==='msg')b=`<div class="panel"><h3>✉️ صندوق الرسائل</h3>${db.msgs.slice().reverse().map(m=>`<div class="row"><div><b>${esc(m.name)}</b> (${esc(m.phone)}) ${m.read?'':'<span class="pill">جديدة</span>'}<div>${esc(m.text)}</div><div class="mut">${esc(prop(m.propId)?.title)} · ${m.at}</div></div><div><button onclick="readM('${m.id}')">مقروءة</button> <button onclick="waM('${m.id}')">رد واتساب</button></div></div>`).join('')||'<div class="empty">لا توجد رسائل</div>'}</div>`;
 if(tab==='ver')b=`<div class="panel"><h3>🪪 توثيق بطاقات التعريف</h3>${pend.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> — ${esc(x.phone)} <span class="pill">${ROLE[x.role]}</span><br><img class="cin" src="${x.cin}" alt="CIN"></div><div><button class="ok" onclick="verify('${x.id}',true)">توثيق ✓</button> <button onclick="verify('${x.id}',false)">رفض</button></div></div>`).join('')||'<div class="empty">لا توجد بطاقات تنتظر المراجعة</div>'}</div><div class="panel"><h3>الحسابات الموثّقة</h3>${db.users.filter(x=>x.verified).map(x=>`<div class="row"><div>${esc(x.name)} — ${esc(x.phone)}</div><span class="pill">موثّق ✓</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;
 if(tab==='props')b=addForm()+`<div class="panel"><h3>كل العقارات</h3>${propRows(db.props)}</div>`;
 if(tab==='comp')b=`<div class="panel"><h3>⚠️ كل الشكاوى</h3>${compRows(db.complaints.slice().reverse(),true)}</div>`;
 if(tab==='tools')b=billPanel();
 if(tab==='users'&&u.role==='admin')b=`<div class="panel"><h3>👥 كل المستخدمين (${db.users.length})</h3>${db.users.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> — ${esc(x.phone)} <span class="pill">${ROLE[x.role]}</span> ${x.verified?'<span class="pill">موثّق ✓</span>':''}${x.cin?`<br><img class="cin" src="${x.cin}" alt="CIN">`:''}</div><div><select onchange="setRole('${x.id}',this.value)">${opts(ROLE,x.role)}</select> <button onclick="verify('${x.id}',${!x.verified})">${x.verified?'إلغاء التوثيق':'توثيق'}</button> <button onclick="waU('${x.id}')">واتساب</button>${x.id!==u.id?` <button onclick="delUser('${x.id}')" aria-label="حذف">🗑️</button>`:''}</div></div>`).join('')||'<div class="empty">لا يوجد مستخدمون</div>'}</div>`;
 if(tab==='data'&&u.role==='admin')b=`<div class="panel"><h3>🗄️ البيانات</h3><p class="mut">نسخة احتياطية (بدون الصور وكلمات المرور):</p><textarea rows="7" readonly onclick="this.select()">${esc(JSON.stringify({users:db.users.map(x=>({...x,pw:'***',cin:x.cin?'[صورة]':''})),props:db.props.map(p=>({...p,imgs:p.imgs.length})),reqs:db.reqs,msgs:db.msgs,complaints:db.complaints},null,1))}</textarea><div class="acts"><button class="pri" onclick="resetDemo()">♻️ إعادة العقارات التجريبية</button><button onclick="wipe()">🗑️ مسح كل البيانات</button></div></div>`;
 const adm=u.role==='admin';return `<h2>⚡ ${adm?'لوحة المدير · صلاحيات كاملة':'لوحة السمسار'} – ${esc(u.name)}</h2>`+tabs([['over','📊 نظرة عامة'],['req',`📋 الطلبات${nr?' ('+nr+')':''}`],['msg',`✉️ الرسائل${nm?' ('+nm+')':''}`],['ver','🪪 التوثيق'],['props','🏘️ العقارات'],['comp','⚠️ الشكاوى'],['tools','🧰 أدوات'],...(adm?[['users','👥 المستخدمون'],['data','🗄️ البيانات']]:[])])+b}
function dashView(){const u=me();if(!u){authMode='login';return authView()}return u.role==='tenant'?tenantDash(u):u.role==='landlord'?landlordDash(u):brokerDash(u)}
function render(){nav();$('main').innerHTML=view==='auth'?authView():view==='dash'?dashView():homeView();window.scrollTo(0,0)}
render();
try{if(!localStorage.getItem(KEY+'_i'))setTimeout(intro,600)}catch(e){}
</script>
</body>
</html>
