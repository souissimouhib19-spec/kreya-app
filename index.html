<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهيب وأصدقاؤه – منصة العقارات والمبيتات في تونس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f9fa;--card:#ffffff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;
  --red:#c8102e;--red-dark:#9e0b22;--ok:#10b981;--warn:#f59e0b;--soft:#fff1f2;
  --shadow:0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg:0 12px 24px -4px rgba(0,0,0,0.1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;line-height:1.6}

.nav{
  position:sticky;top:0;z-index:20;
  background:rgba(255, 255, 255, 0.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 24px;
}
.brand{font-weight:800;font-size:20px;color:var(--red);display:flex;align-items:center;gap:8px}

.hero{
  padding:70px 20px;text-align:center;
  background:linear-gradient(rgba(0,0,0,0.55),rgba(200,16,46,0.75)),url('hero.jpg') center/cover no-repeat;
  color:#fff;
}
.hero h1{margin:0 0 10px;font-size:32px;font-weight:800}
.hero p{margin:0 auto 20px;opacity:.9;font-size:16px;max-width:600px}
.hero button{background:#fff;color:var(--red);border:none;padding:12px 24px;font-weight:800;border-radius:99px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.2)}

.wrap{max-width:1180px;margin:0 auto;padding:30px 16px}
.test-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="nav">
  <div class="brand">🏠 مهيب وأصدقاؤه</div>
  <div><button class="pri" style="background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600">دخول</button></div>
</div>

<div class="hero">
  <h1>لوّج على دارك، مبيتك أو شريك سكن بكل ثقة</h1>
  <p>عقارات موثّقة، المسافة للكلية بالدقيقة، وتواصل مباشر عبر واتساب</p>
  <button>▶ اكتشف المنصة</button>
</div>

<div class="wrap">
  <div class="test-box">
    <h2>الخطوة الأولى ناجحة 100% ✓</h2>
    <p>الواجهة والخلفية يخدمو ببريق. جاهز نزيدوك الخطوة الثانية (الفلاتر والعقارات)؟</p>
  </div>
</div>

</body>
</html>
